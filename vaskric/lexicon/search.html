<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search the Vaskric Lexicon - Vaskric Archive</title>
  <meta name="description" content="Search the Standard Vaskric lexicon by Latin script, IPA, or English meaning.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/main.css">

  <style>
    .ipa { font-family: var(--mono, 'JetBrains Mono', monospace); color: var(--ink-soft, #666); font-size: 0.95em; }
    .vaskoryo-cell { font-family: var(--hangul, 'Noto Serif KR', serif); color: var(--teal, #3d6b5c); opacity: 0.7; }
    .etymology { font-size: 0.85em; font-style: italic; color: var(--ink-faint, #888); }
    .search-container { display: flex; gap: 1rem; align-items: center; margin: 1.5rem 0; }
    .search-container input { font-family: var(--serif-body, 'EB Garamond', serif); font-size: 1.1rem; padding: 0.7em 0.9em; border: 1px solid var(--rule-strong, #ccc); border-radius: 3px; background: rgba(255, 255, 255, 0.4); color: var(--ink, #333); outline: none; width: 100%; box-sizing: border-box; }
    .search-container input:focus { border-color: var(--teal, #3d6b5c); box-shadow: 0 0 0 2px rgba(61, 107, 92, 0.2); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; background: rgba(255, 255, 255, 0.25); }
    th, td { padding: 0.5em 0.7em; text-align: left; border-bottom: 1px solid var(--rule, #eee); vertical-align: top; }
    th { font-family: var(--serif-display, serif); font-variant: small-caps; font-weight: 600; color: var(--ink-soft, #555); border-bottom: 1px solid var(--rule-strong, #ccc); background: rgba(43, 29, 14, 0.04); }
    tr:hover td { background: rgba(43, 29, 14, 0.025); }
    .site-nav { margin-bottom: 2rem; font-size: 0.9rem; font-family: var(--serif-display, serif); }
    .site-nav a { text-decoration: none; color: var(--oxblood, #7a2e1f); }
    .site-nav a:hover { text-decoration: underline; }
    .divider { margin: 0 0.5rem; color: #ccc; }
  </style>
  
  <!-- Load Supabase Config -->
  <script src="../../assets/js/supabase-config.js"></script>
</head>
<body>

  <nav class="site-nav" aria-label="Site">
    <a href="../../index.html">&larr; Archive</a>
    <span class="divider">&middot;</span>
    <a href="../index.html">Vaskric</a>
    <span class="divider">&middot;</span>
    <a href="index.html">Lexicon</a>
    <span class="divider">&middot;</span>
    <a href="../grammar/index.html">Grammar</a>
    <span class="divider">&middot;</span>
    <a href="../../about.html">About</a>
  </nav>

  <main>
    <h1>Search the Vaskric Lexicon</h1>
    <p class="muted italic" style="margin-top:-0.5em;"><em>Type a Latin spelling, IPA, or English meaning</em></p>

    <div class="search-container">
      <input id="q" type="search" placeholder="Search: solar, /solra/, sun, tall, fat&hellip;" autocomplete="off" autofocus aria-label="Search the lexicon" />
      <span id="count" class="muted small-caps" style="font-size:0.9rem; white-space:nowrap;">Loading...</span>
    </div>

    <p id="empty" style="display:none; text-align:center; font-style:italic; color:var(--ink-faint, #999); margin-top:2em;">No matches. Try a shorter query.</p>
    
    <div id="results"></div>
  </main>

  <footer>
    <p><a href="index.html">&larr; Lexicon overview</a> &middot; Search</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const results = document.getElementById('results');
      const countEl = document.getElementById('count');
      const emptyEl = document.getElementById('empty');
      const input = document.getElementById('q');

      const SUPABASE_URL = window.SUPABASE_URL;
      const SUPABASE_KEY = window.SUPABASE_KEY;

      let LEXICON = [];

      async function fetchData() {
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/lexicon?select=*`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });

          if (!response.ok) throw new Error('Network response was not ok');
          
          const data = await response.json();
          
          LEXICON = data.map(item => [
            item.hangul,
            item.latin,
            item.ipa,
            item.meaning,
            item.etymology,
            item.category
          ]);

          countEl.textContent = LEXICON.length + ' entries';
          
          const params = new URLSearchParams(location.search);
          if (params.get('q')) input.value = params.get('q');
          render(input.value);
        } catch (error) {
          results.innerHTML = '<div style="padding: 1rem; color: red; border: 1px solid red; background: #ffe6e6;">Error loading database: ' + error.message + '</div>';
          countEl.textContent = 'Error';
        }
      }

      fetchData();

      function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&<>"/g, function(c) {
          if (c === '&') return '&amp;';
          if (c === '<') return '&lt;';
          if (c === '>') return '&gt;';
          if (c === '"') return '&quot;';
          return c;
        });
      }

      function highlight(text, q) {
        if (!q) return escapeHtml(text);
        const escText = escapeHtml(text);
        const escQ = escapeHtml(q);
        const safeQ = escQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('(' + safeQ + ')', 'ig');
        return escText.replace(re, '<mark style="background:rgba(61,107,92,0.25); padding: 0 2px; border-radius:2px;">$1</mark>');
      }

      function render(q) {
        if (!LEXICON.length) return; 

        q = q.trim();
        const qLower = q.toLowerCase();

        const matches = q
          ? LEXICON.filter(function(row) { 
              return row.some(function(cell) { 
                return String(cell).toLowerCase().includes(qLower); 
              });
            })
          : LEXICON;

        countEl.textContent = q ? (matches.length + ' / ' + LEXICON.length) : (LEXICON.length + ' entries');
        emptyEl.style.display = matches.length === 0 ? 'block' : 'none';

        const groups = {};
        for (let i = 0; i < matches.length; i++) {
          const row = matches[i];
          const cat = row[row.length - 1] || 'Uncategorized';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(row);
        }

        let html = '';
        for (const cat in groups) {
          if (groups.hasOwnProperty(cat)) {
            const rows = groups[cat];
            html += '<h3>' + escapeHtml(cat) + '</h3>';
            
            html += '<table><thead><tr>';
            html += '<th>Latin</th><th>IPA</th><th>Meaning</th><th>Etymology / Origin</th><th>Eastern (Hangul)</th>';
            html += '</tr></thead><tbody>';

            for (let j = 0; j < rows.length; j++) {
              const row = rows[j];
              html += '<tr>';
              html += '<td><em>' + highlight(row[1], q) + '</em></td>';
              html += '<td class="ipa">' + highlight(row[2], q) + '</td>';
              html += '<td>' + highlight(row[3], q) + '</td>';
              html += '<td class="etymology">' + highlight(row[4], q) + '</td>';
              html += '<td class="vaskoryo-cell">' + highlight(row[0], q) + '</td>';
              html += '</tr>';
            }
            html += '</tbody></table>';
          }
        }
        results.innerHTML = html;
      }

      input.addEventListener('input', function(e) {
        render(e.target.value);
        history.replaceState(null, '', e.target.value ? '?q=' + encodeURIComponent(e.target.value) : location.pathname);
      });
    });
  </script>
</body>
</html>
